name: 5h usage rollup

# Free 5-hourly cron (Vercel Hobby caps cron at once/day, so we schedule here).
# Hits the dashboard's rollup endpoint: resets the 5h window, refreshes summary.
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch: {}

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rollup
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set repo variable DASHBOARD_URL and secret CRON_SECRET."; exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${DASHBOARD_URL%/}/api/cron/rollup")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
